<svg
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
>
    <defs>
        <linearGradient id="back-panel" x1="4" y1="1" x2="14" y2="12">
            <stop offset="0" stop-color="#FF8593"/>
            <stop offset="0.45" stop-color="#C9143A"/>
            <stop offset="1" stop-color="#720017"/>
        </linearGradient>

        <linearGradient id="front-panel" x1="1.5" y1="3" x2="13" y2="15">
            <stop offset="0" stop-color="#FF6678"/>
            <stop offset="0.38" stop-color="#C00830"/>
            <stop offset="1" stop-color="#700016"/>
        </linearGradient>

        <linearGradient id="panel-tile" x1="2" y1="7" x2="11" y2="14">
            <stop offset="0" stop-color="#FF8C99"/>
            <stop offset="1" stop-color="#E52D51"/>
        </linearGradient>

        <linearGradient id="glass-highlight" x1="1.5" y1="3" x2="11" y2="8">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Rear floating workspace -->
    <rect
            x="3"
            y="0.75"
            width="12.25"
            height="11.25"
            rx="2"
            fill="url(#back-panel)"
            stroke="#87001D"
            stroke-width="0.65"
    />

    <!-- Rear-panel reflection -->
    <path
            d="M4.25 1.75H11.25C12.7 1.75 13.6 2.15 14.15 2.85"
            stroke="#FFFFFF"
            stroke-opacity="0.5"
            stroke-width="0.65"
            stroke-linecap="round"
    />

    <!-- Main glass workspace -->
    <rect
            x="0.75"
            y="2.75"
            width="12.65"
            height="12.5"
            rx="2.15"
            fill="url(#front-panel)"
            stroke="#720016"
            stroke-width="0.7"
    />

    <!-- Inner glass rim -->
    <rect
            x="1.4"
            y="3.4"
            width="11.35"
            height="11.2"
            rx="1.55"
            stroke="#FFFFFF"
            stroke-opacity="0.72"
            stroke-width="0.55"
    />

    <!-- Toolbar separator -->
    <path
            d="M1.45 6.35H12.75"
            stroke="#FFFFFF"
            stroke-opacity="0.88"
            stroke-width="0.65"
    />

    <!-- Toolbar controls -->
    <circle
            cx="3.15"
            cy="4.95"
            r="0.52"
            fill="#FF8A98"
            stroke="#FFFFFF"
            stroke-width="0.35"
    />

    <circle
            cx="5.05"
            cy="4.95"
            r="0.52"
            fill="#FF687B"
            stroke="#FFFFFF"
            stroke-width="0.35"
    />

    <circle
            cx="6.95"
            cy="4.95"
            r="0.52"
            fill="#E93455"
            stroke="#FFFFFF"
            stroke-width="0.35"
    />

    <!-- Main dashboard pane -->
    <rect
            x="2.15"
            y="7.45"
            width="5.25"
            height="5.75"
            rx="0.85"
            fill="url(#panel-tile)"
            stroke="#FFFFFF"
            stroke-opacity="0.82"
            stroke-width="0.5"
    />

    <!-- Secondary dashboard pane -->
    <rect
            x="8.2"
            y="7.45"
            width="3.55"
            height="2.45"
            rx="0.7"
            fill="#FF7182"
            fill-opacity="0.88"
            stroke="#FFFFFF"
            stroke-opacity="0.78"
            stroke-width="0.5"
    />

    <!-- Tertiary dashboard pane -->
    <rect
            x="8.2"
            y="10.7"
            width="3.55"
            height="2.5"
            rx="0.7"
            fill="#A90029"
            fill-opacity="0.9"
            stroke="#FFFFFF"
            stroke-opacity="0.68"
            stroke-width="0.5"
    />

    <!-- Controlled liquid-glass reflection -->
    <path
            d="M1.8 3.8C4.1 3.05 8 3.1 10.55 4"
            stroke="url(#glass-highlight)"
            stroke-width="0.7"
            stroke-linecap="round"
    />
</svg>