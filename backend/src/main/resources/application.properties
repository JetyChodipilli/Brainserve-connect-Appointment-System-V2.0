# ============================================================================
# BRAINSERVE APPOINTMENT SERVICE - MAIN CONFIGURATION
# Secrets are loaded from backend/.env for local development or from real
# environment variables in CI/Docker/production.
# ============================================================================

# Load backend/.env when Maven is started from either the backend directory
# or the repository root with -f backend/pom.xml.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Application and server
spring.application.name=brainserve-appointment-service
brainserve.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:5173}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.error.include-message=never
server.error.include-stacktrace=never

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/brainserve}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
# Fail a request before the browser's 20-second deadline when the pool is exhausted.
# A queued request must not occupy a servlet thread for the old 30-second default.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:20000}
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:5}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JPA and Flyway
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:brainserve.internal-calls.v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.brainserve.appointment.notification.api
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
spring.kafka.admin.fail-fast=false

brainserve.notification.internal-call-topic=${INTERNAL_CALL_TOPIC:brainserve.internal-calls.v1}
brainserve.notification.internal-call-topic-partitions=${INTERNAL_CALL_TOPIC_PARTITIONS:3}
brainserve.notification.internal-call-topic-replicas=${INTERNAL_CALL_TOPIC_REPLICAS:3}
brainserve.notification.internal-call-topic-min-insync-replicas=${INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS:2}
brainserve.notification.internal-call-dispatch-ms=${INTERNAL_CALL_DISPATCH_MS:1000}
brainserve.notification.internal-call-retry-seconds=${INTERNAL_CALL_RETRY_SECONDS:30}

# Email / SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# JSON and file upload limits
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}

# Authentication and encryption
brainserve.security.jwt-secret=${JWT_SECRET}
brainserve.security.pii-encryption-key=${PII_ENCRYPTION_KEY}
brainserve.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
brainserve.security.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
brainserve.security.expired-session-retention-days=${EXPIRED_SESSION_RETENTION_DAYS:30}
brainserve.security.session-retention-cron=${SESSION_RETENTION_CRON:0 25 3 * * *}
brainserve.security.password-change-otp-minutes=${PASSWORD_CHANGE_OTP_MINUTES:10}
brainserve.security.account-recovery-code-minutes=${ACCOUNT_RECOVERY_CODE_MINUTES:30}
brainserve.security.account-archive-otp-minutes=${ACCOUNT_ARCHIVE_OTP_MINUTES:10}
brainserve.security.account-archive-otp-resend-seconds=${ACCOUNT_ARCHIVE_OTP_RESEND_SECONDS:60}
brainserve.security.account-archive-otp-max-attempts=${ACCOUNT_ARCHIVE_OTP_MAX_ATTEMPTS:5}
brainserve.security.admin-password-verification-lock-minutes=${ADMIN_PASSWORD_VERIFICATION_LOCK_MINUTES:15}
brainserve.security.allowed-origins=${BRAIN_SERVE_ALLOWED_ORIGINS:http://localhost:5173}

# Official staff login policy
brainserve.identity.company-email-domain=${COMPANY_EMAIL_DOMAIN:brainserve.in}

# System Admin bootstrap
brainserve.bootstrap.system-admin-email=${SYSTEM_ADMIN_EMAIL:}
brainserve.bootstrap.system-admin-password=${SYSTEM_ADMIN_DEFAULT_PASSWORD:}
brainserve.bootstrap.system-admin-enabled=${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:false}

# CEO bootstrap
brainserve.bootstrap.ceo-enabled=${CEO_BOOTSTRAP_ENABLED:false}
brainserve.bootstrap.ceo-name=${CEO_BOOTSTRAP_NAME:BrainServe CEO}
brainserve.bootstrap.ceo-email=${CEO_BOOTSTRAP_EMAIL:}
brainserve.bootstrap.ceo-password=${CEO_BOOTSTRAP_PASSWORD:}

brainserve.identity.support-email=${SUPPORT_EMAIL:support@brainserve.in}
brainserve.identity.archive-retention-years=${ACCOUNT_ARCHIVE_RETENTION_YEARS:7}
brainserve.identity.account-closure-schedule=${ACCOUNT_CLOSURE_CRON:0 5 0 * * *}

# Reporting, history and exports
brainserve.reporting.dashboard-cache-seconds=${DASHBOARD_CACHE_SECONDS:180}
brainserve.reporting.summary-refresh-ms=${SUMMARY_REFRESH_MS:60000}
brainserve.reporting.history-maintenance-cron=${HISTORY_MAINTENANCE_CRON:0 15 0 * * *}
brainserve.reporting.retention-cron=${RETENTION_CRON:0 40 2 * * *}
brainserve.reporting.partition-archive-enabled=${PARTITION_ARCHIVE_ENABLED:true}
brainserve.reporting.partition-archive-cron=${PARTITION_ARCHIVE_CRON:0 20 4 * * 0}
brainserve.reporting.partition-cleanup-enabled=${PARTITION_CLEANUP_ENABLED:true}
brainserve.reporting.partition-cleanup-cron=${PARTITION_CLEANUP_CRON:0 35 5 * * 0}
brainserve.reporting.archive-disposal-cron=${ARCHIVE_DISPOSAL_CRON:0 10 6 * * 0}
brainserve.reporting.operational-disposal-cron=${OPERATIONAL_DISPOSAL_CRON:0 50 5 * * *}
brainserve.reporting.archive-encryption-keys=${ARCHIVE_ENCRYPTION_KEYS}
brainserve.reporting.archive-encryption-active-key-version=${ARCHIVE_ENCRYPTION_ACTIVE_KEY_VERSION:v1}
brainserve.reporting.export-retention-days=${REPORT_EXPORT_RETENTION_DAYS:7}
brainserve.reporting.export-max-rows=${REPORT_EXPORT_MAX_ROWS:1000000}
brainserve.reporting.export-cleanup-cron=${REPORT_EXPORT_CLEANUP_CRON:0 10 3 * * *}
brainserve.backup.lifecycle-retention-days=${BACKUP_LIFECYCLE_RETENTION_DAYS:35}
brainserve.backup.expiry-confirmation-cron=${BACKUP_EXPIRY_CONFIRMATION_CRON:0 45 6 * * *}

# Appointment and notification rules
brainserve.appointment.office-zone=${OFFICE_TIME_ZONE:Asia/Kolkata}
brainserve.appointment.slot-minutes=${APPOINTMENT_SLOT_MINUTES:30}
brainserve.appointment.max-advance-days=${APPOINTMENT_MAX_ADVANCE_DAYS:90}
brainserve.appointment.host-sync-ms=${APPOINTMENT_HOST_SYNC_MS:60000}
brainserve.appointment.qr-signing-secret=${QR_PASS_SIGNING_SECRET}
brainserve.notification.from=${MAIL_FROM:noreply@brainserve.in}
brainserve.notification.poll-ms=${NOTIFICATION_POLL_MS:5000}

# Private document storage and malware scanning
brainserve.document.bucket=${DOCUMENT_BUCKET:brainserve-private}
brainserve.document.max-bytes=${DOCUMENT_MAX_BYTES:10485760}
brainserve.document.download-url-minutes=${DOCUMENT_DOWNLOAD_URL_MINUTES:5}
brainserve.document.clamav-host=${CLAMAV_HOST:localhost}
brainserve.document.clamav-port=${CLAMAV_PORT:3310}

# S3-compatible object storage / local MinIO
aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
aws.s3.region=${S3_REGION:ap-south-1}
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}

# Operations and health endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# Logging
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]
