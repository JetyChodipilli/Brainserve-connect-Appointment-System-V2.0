<svg
        width="24"
        height="24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
        preserveAspectRatio="xMidYMid meet"
        shape-rendering="geometricPrecision"
        focusable="false"
>
    <defs>
        <radialGradient
                id="hq-globe"
                cx="0"
                cy="0"
                r="1"
                gradientUnits="userSpaceOnUse"
                gradientTransform="translate(4.3 3.4) rotate(46) scale(14)"
        >
            <stop offset="0" stop-color="#FF8796"/>
            <stop offset="0.38" stop-color="#D51640"/>
            <stop offset="0.72" stop-color="#A00028"/>
            <stop offset="1" stop-color="#620012"/>
        </radialGradient>

        <linearGradient id="hq-building" x1="5" y1="4" x2="11" y2="13">
            <stop offset="0" stop-color="#C9163C"/>
            <stop offset="1" stop-color="#760018"/>
        </linearGradient>

        <linearGradient id="hq-highlight" x1="2" y1="2" x2="8" y2="7">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="hq-window" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFB0B8"/>
            <stop offset="1" stop-color="#FF5D73"/>
        </linearGradient>
    </defs>

    <!-- Global glass body -->
    <circle
            cx="8"
            cy="8"
            r="7.1"
            fill="url(#hq-globe)"
            stroke="#680014"
            stroke-width="0.7"
    />

    <!-- Inner glass edge -->
    <circle
            cx="8"
            cy="8"
            r="6.42"
            stroke="#FFFFFF"
            stroke-opacity="0.5"
            stroke-width="0.5"
    />

    <!-- Subtle globe structure -->
    <g
            stroke="#FFFFFF"
            stroke-opacity="0.25"
            stroke-width="0.48"
            stroke-linecap="round"
    >
        <path d="M1.55 8H14.45"/>

        <path
                d="M8 1.35C5.9 3.15 5.15 5.55 5.15 8S5.9 12.85 8 14.65"
        />

        <path
                d="M8 1.35C10.1 3.15 10.85 5.55 10.85 8S10.1 12.85 8 14.65"
        />
    </g>

    <!-- Corporate headquarters -->
    <path
            d="M4.25 12.3V7.65H5.85V5.75L8 4.05L10.15 5.75V7.65H11.75V12.3H4.25Z"
            fill="url(#hq-building)"
            stroke="#FFFFFF"
            stroke-opacity="0.92"
            stroke-width="0.62"
            stroke-linejoin="round"
    />

    <!-- Headquarters roof -->
    <path
            d="M5.85 5.75L8 4.05L10.15 5.75"
            stroke="#FFFFFF"
            stroke-width="0.65"
            stroke-linecap="round"
            stroke-linejoin="round"
    />

    <!-- Building windows -->
    <g
            fill="url(#hq-window)"
            stroke="#FFFFFF"
            stroke-width="0.28"
    >
        <rect
                x="6.35"
                y="6.55"
                width="0.75"
                height="1.2"
                rx="0.25"
        />

        <rect
                x="7.62"
                y="5.75"
                width="0.76"
                height="2"
                rx="0.25"
        />

        <rect
                x="8.9"
                y="6.55"
                width="0.75"
                height="1.2"
                rx="0.25"
        />

        <rect
                x="5.1"
                y="8.65"
                width="0.75"
                height="1.05"
                rx="0.22"
        />

        <rect
                x="6.35"
                y="8.65"
                width="0.75"
                height="1.05"
                rx="0.22"
        />

        <rect
                x="8.9"
                y="8.65"
                width="0.75"
                height="1.05"
                rx="0.22"
        />

        <rect
                x="10.15"
                y="8.65"
                width="0.75"
                height="1.05"
                rx="0.22"
        />
    </g>

    <!-- Headquarters entrance -->
    <path
            d="M7.15 12.3V10.15H8.85V12.3"
            fill="#FF6075"
            stroke="#FFFFFF"
            stroke-width="0.42"
            stroke-linejoin="round"
    />

    <!-- Global operating orbit -->
    <path
            d="M1.45 10.25C3.25 13.45 10.65 14.35 14.5 9.75"
            stroke="#FFFFFF"
            stroke-opacity="0.86"
            stroke-width="0.68"
            stroke-linecap="round"
    />

    <!-- International office points -->
    <g
            fill="#FF7183"
            stroke="#FFFFFF"
            stroke-width="0.4"
    >
        <circle cx="2.15" cy="11.15" r="0.55"/>
        <circle cx="6.25" cy="13.35" r="0.48"/>
        <circle cx="11.7" cy="12.45" r="0.48"/>
        <circle cx="13.85" cy="10.5" r="0.55"/>
    </g>

    <!-- Liquid-glass reflection -->
    <path
            d="M2.55 4.25C3.45 2.85 4.8 2.05 6.25 1.72"
            stroke="url(#hq-highlight)"
            stroke-width="0.82"
            stroke-linecap="round"
    />
</svg>