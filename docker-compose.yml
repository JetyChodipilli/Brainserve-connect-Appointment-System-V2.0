name: brainserve-connect-appointment-system

services:
  postgres:
    image: postgres:17.2-alpine
    entrypoint: ["/bin/sh", "/opt/brainserve/postgres-entrypoint.sh"]
    environment:
      POSTGRES_DB: brainserve
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
      - ./ops/postgres/postgres-entrypoint.sh:/opt/brainserve/postgres-entrypoint.sh:ro
      - ./ops/postgres/01-replication-hba.sh:/docker-entrypoint-initdb.d/01-replication-hba.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-backup:
    image: postgres:17.2-alpine
    entrypoint: ["/bin/sh", "/opt/brainserve/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: "${DB_USERNAME:-postgres}"
      PGPASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_BACKUP_INTERVAL_SECONDS: "${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}"
      POSTGRES_BACKUP_RETENTION_DAYS: "${POSTGRES_BACKUP_RETENTION_DAYS:-14}"
      POSTGRES_WAL_RETENTION_DAYS: "${POSTGRES_WAL_RETENTION_DAYS:-35}"
    volumes:
      - postgres_backups:/backups
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
      - ./ops/postgres/backup-loop.sh:/opt/brainserve/backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9096:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      INTERNAL_CALL_TOPIC: "${INTERNAL_CALL_TOPIC:-brainserve.internal-calls.v1}"
      INTERNAL_CALL_TOPIC_PARTITIONS: "${INTERNAL_CALL_TOPIC_PARTITIONS:-3}"
      INTERNAL_CALL_TOPIC_REPLICAS: "${INTERNAL_CALL_TOPIC_REPLICAS:-3}"
      INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS: "${INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS:-2}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic "$${INTERNAL_CALL_TOPIC}" \
          --partitions "$${INTERNAL_CALL_TOPIC_PARTITIONS}" \
          --replication-factor "$${INTERNAL_CALL_TOPIC_REPLICAS}"
        /opt/kafka/bin/kafka-configs.sh \
          --bootstrap-server kafka:29092 \
          --alter \
          --entity-type topics \
          --entity-name "$${INTERNAL_CALL_TOPIC}" \
          --add-config "min.insync.replicas=$${INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS}"
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/brainserve-private;
      mc version enable local/brainserve-private;
      mc anonymous set none local/brainserve-private;"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}"

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  backend:
    profiles: ["full-stack"]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/brainserve
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      REDIS_TIMEOUT: 2s

      SYSTEM_ADMIN_EMAIL: "${SYSTEM_ADMIN_EMAIL:-}"
      SYSTEM_ADMIN_DEFAULT_PASSWORD: "${SYSTEM_ADMIN_DEFAULT_PASSWORD:?Set SYSTEM_ADMIN_DEFAULT_PASSWORD in .env}"
      SYSTEM_ADMIN_BOOTSTRAP_ENABLED: "${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:-false}"
      CEO_BOOTSTRAP_ENABLED: "${CEO_BOOTSTRAP_ENABLED:-false}"
      CEO_BOOTSTRAP_NAME: "${CEO_BOOTSTRAP_NAME:-BrainServe CEO}"
      CEO_BOOTSTRAP_EMAIL: "${CEO_BOOTSTRAP_EMAIL:-}"
      CEO_BOOTSTRAP_PASSWORD: "${CEO_BOOTSTRAP_PASSWORD:-}"

      COMPANY_EMAIL_DOMAIN: "${COMPANY_EMAIL_DOMAIN:-brainserve.in}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support@brainserve.in}"
      OFFICE_TIME_ZONE: "${OFFICE_TIME_ZONE:-Asia/Kolkata}"

      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      PII_ENCRYPTION_KEY: "${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY in .env}"
      QR_PASS_SIGNING_SECRET: "${QR_PASS_SIGNING_SECRET:?Set QR_PASS_SIGNING_SECRET in .env}"

      ACCOUNT_ARCHIVE_OTP_MINUTES: "${ACCOUNT_ARCHIVE_OTP_MINUTES:-10}"
      ACCOUNT_ARCHIVE_OTP_RESEND_SECONDS: "${ACCOUNT_ARCHIVE_OTP_RESEND_SECONDS:-60}"
      ACCOUNT_ARCHIVE_OTP_MAX_ATTEMPTS: "${ACCOUNT_ARCHIVE_OTP_MAX_ATTEMPTS:-5}"
      ADMIN_PASSWORD_VERIFICATION_LOCK_MINUTES: "${ADMIN_PASSWORD_VERIFICATION_LOCK_MINUTES:-15}"
      ACCOUNT_ARCHIVE_RETENTION_YEARS: "${ACCOUNT_ARCHIVE_RETENTION_YEARS:-7}"
      EXPIRED_SESSION_RETENTION_DAYS: "${EXPIRED_SESSION_RETENTION_DAYS:-30}"
      SESSION_RETENTION_CRON: "${SESSION_RETENTION_CRON:-0 25 3 * * *}"
      FORWARD_HEADERS_STRATEGY: "${FORWARD_HEADERS_STRATEGY:-none}"
      ACCOUNT_CLOSURE_CRON: "${ACCOUNT_CLOSURE_CRON:-0 5 0 * * *}"

      DASHBOARD_CACHE_SECONDS: "${DASHBOARD_CACHE_SECONDS:-180}"
      REPORT_EXPORT_RETENTION_DAYS: "${REPORT_EXPORT_RETENTION_DAYS:-7}"
      REPORT_EXPORT_MAX_ROWS: "${REPORT_EXPORT_MAX_ROWS:-1000000}"
      PARTITION_ARCHIVE_ENABLED: "${PARTITION_ARCHIVE_ENABLED:-true}"
      PARTITION_CLEANUP_ENABLED: "${PARTITION_CLEANUP_ENABLED:-true}"
      ARCHIVE_ENCRYPTION_KEYS: "${ARCHIVE_ENCRYPTION_KEYS:?Set ARCHIVE_ENCRYPTION_KEYS to version=base64-key}"
      ARCHIVE_ENCRYPTION_ACTIVE_KEY_VERSION: "${ARCHIVE_ENCRYPTION_ACTIVE_KEY_VERSION:-v1}"
      BACKUP_LIFECYCLE_RETENTION_DAYS: "${BACKUP_LIFECYCLE_RETENTION_DAYS:-35}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-brainserve.internal-calls.v1}"
      INTERNAL_CALL_TOPIC: "${INTERNAL_CALL_TOPIC:-brainserve.internal-calls.v1}"
      INTERNAL_CALL_TOPIC_PARTITIONS: "${INTERNAL_CALL_TOPIC_PARTITIONS:-3}"
      INTERNAL_CALL_TOPIC_REPLICAS: "${INTERNAL_CALL_TOPIC_REPLICAS:-3}"
      INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS: "${INTERNAL_CALL_TOPIC_MIN_INSYNC_REPLICAS:-2}"

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-false}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-false}"
      MAIL_FROM: "${MAIL_FROM:-noreply@brainserve.in}"

      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

      S3_ENDPOINT: http://minio:9000
      S3_REGION: "${S3_REGION:-ap-south-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-http://localhost:9000}"

      FRONTEND_PUBLIC_URL: "${DOCKER_FRONTEND_PUBLIC_URL:-http://localhost:3000}"
      BRAIN_SERVE_ALLOWED_ORIGINS: "${DOCKER_ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  minio_data:
  clamav_data:
  postgres_backups:
  postgres_wal_archive:
