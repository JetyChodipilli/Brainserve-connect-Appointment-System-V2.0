name: BrainServe CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: brainserve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run source and regression tests
        run: npm run test:regression

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Compile and test backend
        env:
          ARCHIVE_ENCRYPTION_KEYS: v1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PII_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QR_PASS_SIGNING_SECRET: ci-only-qr-pass-signing-secret-at-least-thirty-two-characters
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Require real PostgreSQL integration coverage
        working-directory: .
        run: node scripts/assert-database-tests.mjs

      - name: Upload backend failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-failures
          path: backend/target/surefire-reports/
          retention-days: 7

  staging:
    name: Staging & recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_ID: ${{ github.sha }}
      STAGING_DOMAIN: localhost
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify operational rejection paths
        run: node --test --test-isolation=none scripts/tests/*.test.mjs
      - name: Generate disposable secrets without logging them
        run: node scripts/generate-local-env.mjs > /dev/null
      - name: Install staging, restore database, and reapply pinned images
        run: bash ops/staging/verify.sh
      - name: Upload non-sensitive staging evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: staging-recovery-evidence
          path: |
            /tmp/brainserve-staging-evidence/result.txt
            /tmp/brainserve-staging-evidence/*-schema.txt
          retention-days: 7
      - name: Clean disposable stack
        if: always()
        run: docker compose --env-file backend/.env -f docker-compose.yml -f ops/staging/compose.yml --profile full-stack down --volumes
